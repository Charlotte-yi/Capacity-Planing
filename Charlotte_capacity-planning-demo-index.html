.person-anchor-row{background:#f7f2ff!important;box-shadow:inset 4px 0 0 var(--purple)}
.person-anchor-row .assignee-name{color:#4f2fae}
.person-anchor-row .assignee-name::after{content:"Finding work";display:inline-block;margin-left:8px;padding:2px 6px;border-radius:999px;background:#ede4ff;color:#5f3cc5;font-size:9px;font-weight:800;vertical-align:middle}
.person-anchor-row .timeline-cell{background:linear-gradient(90deg,rgba(116,71,247,.07),rgba(116,71,247,.025))}
.person-anchor-row .remaining{color:#6846cf!important;font-weight:800}
.schedule-shell.editing-session .published-bar{opacity:.24;filter:grayscale(.78)}
.schedule-shell.editing-session .published-bar.current-selected,
.schedule-shell.editing-session .published-bar.reassign-source{opacity:1;filter:none}
.schedule-shell.editing-session .draft-bar{opacity:1;filter:none}
.draft-bar{position:absolute;border:2px solid var(--purple)!important;border-radius:6px;height:24px;top:10px;display:flex;align-items:center;justify-content:space-between;padding:0 5px;z-index:8;font-size:10px;overflow:visible}
.draft-bar::before{content:"Draft";position:absolute;top:-16px;left:-2px;height:15px;line-height:15px;padding:0 5px;border-radius:4px 4px 0 0;background:var(--purple);color:white;font-size:8px;font-weight:800}
.draft-bar.overdue{background:#cc3f42;color:#fff}
.draft-bar.inprogress{background:#3d7edb;color:#fff}
.draft-bar.notstarted{background:#99968e;color:#fff}
.draft-bar.completed{background:#2e9c57;color:#fff}
.draft-bar.conflict{box-shadow:0 0 0 2px #d97706}
.draft-bar .conflict-label{position:absolute;right:2px;top:-17px;color:#8a5200;background:#fff4dd;border:1px solid #edc778;border-radius:4px;padding:1px 4px;font-size:8px}
.work-item.drafted{background:#f7f4ff;border-color:#d8caff;opacity:.68}
.work-item.drafted em{color:#603cc4;font-style:normal;font-weight:800}
.published-bar.reassign-source{outline:2px dashed var(--purple);outline-offset:1px}
.pending-source-label{position:absolute;top:1px;right:2px;font-size:8px;background:#efe8ff;color:#5e3fc1;border:1px solid #cdbbff;padding:1px 4px;border-radius:4px;z-index:5}

.planning-outlook-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch;margin-top:8px}
.planning-outlook-chart{min-width:0}
.week-summary{background:#f4f0ff;border:1px solid #ddd2ff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.week-summary-head{display:flex;justify-content:space-between;align-items:center;color:#665c82;font-weight:700}
.week-demand{font-size:28px;line-height:1;color:#20173a}
.week-demand-label{display:block;margin-top:3px;font-size:11px;color:#665c82}
.week-summary-metrics{display:grid;gap:8px}
.week-summary-metrics>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:8px;border-top:1px solid #ddd2ff}
.week-summary-metrics b{font-size:18px;color:#20173a}
.week-summary-metrics span{font-size:10px;color:#665c82;text-align:right}
.week-summary p{margin:0;padding-top:10px;border-top:1px solid #ddd2ff;color:#51466d;line-height:1.45}

.current-assignee-row{background:#f5f0ff;box-shadow:inset 4px 0 0 var(--purple)}
.current-assignee-row>.assignee-col{background:#f5f0ff}
.current-assignee-row>.assignee-col strong{color:#5732bd}
.current-assignee-row>.timeline-row{background:linear-gradient(90deg,rgba(116,71,247,.075),rgba(116,71,247,.025))}

.capacity-title{color:#5f3cc5}
.section-heading{display:flex;align-items:center;gap:7px}
.section-heading .section-symbol{font-size:15px;font-weight:900}
.portfolio-heading{color:#315ccf}.portfolio-heading .section-symbol{color:#315ccf}
.summary-heading{color:#9a5b12}.summary-heading .section-symbol{color:#c47a16}
.workspace-heading{color:#5a3db6}.workspace-heading .section-symbol{color:#7048d7}
.horizon-select{appearance:auto;border:1px solid var(--border);background:white;border-radius:8px;padding:8px 28px 8px 10px;font:inherit;color:var(--text);cursor:pointer}
.outlook-metrics{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.outlook-metrics b{color:var(--text)}
.gantt-row{min-height:70px;height:auto}
.timeline-row{min-height:70px}
.published-bar,.proposed-bar,.draft-bar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.legend-dot.yellow{background:#d9a51f}
.published-bar.atrisk{background:#9c9992;color:#fff;border:2px solid #e1ad25}
.draft-atrisk{background:#99958e;color:#fff;box-shadow:inset 0 0 0 2px #e1ad25}
.assignment-view-tabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:8px}

.assignment-view-tabs button.active{background:#eee7ff;color:#623fd0;font-weight:800}
.view-hidden{display:none!important}
.calendar-assignment-shell{display:grid;grid-template-columns:280px 1fr;height:720px;border:1px solid var(--border);background:#fff}
.calendar-sidebar{border-right:1px solid var(--border);overflow:auto}
.calendar-mini{padding:12px;border-bottom:1px solid var(--border)}
.calendar-mini-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calendar-mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}
.calendar-mini-grid span{padding:4px 2px;border-radius:5px}

    const dayEnd=new Date(dayStart.getTime()+6*86400000);

    const fmt=(dt,withYear=false)=>dt.toLocaleDateString('en-US',{month:'short',day:'numeric',...(withYear?{year:'numeric'}:{})});
    const weekLabel=`${fmt(dayStart)}–${fmt(dayEnd,true)}`;
    const containsToday=today>=dayStart&&today<=dayEnd;
    const todayIndex=containsToday?Math.round((today-dayStart)/86400000):-1;

    const dayPct=(date)=>Math.max(0,Math.min(100,((new Date(date+'T00:00:00')-dayStart)/(86400000*7))*100));
    const dayWidth=(a,b)=>Math.max(7,dayPct(b)-dayPct(a)+100/7);
    const overlap=(a,b)=>!(new Date(a.end+'T00:00:00')<new Date(b.start+'T00:00:00')||new Date(a.start+'T00:00:00')>new Date(b.end+'T00:00:00'));
    const intersectsWeek=(item)=>!(new Date(item.end+'T00:00:00')<dayStart||new Date(item.start+'T00:00:00')>dayEnd);
    const weekDays=Array.from({length:7},(_,i)=>new Date(dayStart.getTime()+i*86400000));

    function layoutPerson(p){
      const items=[];

      // Published existing work in the current week.
      existing.filter(x=>x.personId===p.id&&intersectsWeek(x)).forEach(x=>{
        const selectedRelated=selectedWorks.some(w=>w.id===x.workId);
        const pendingDraft=state.drafts.some(d=>d.workId===x.workId);
        items.push({...x,_kind:'published',_related:selectedRelated||pendingDraft});
      });

      // Proposed placements for selected Work/Tasks.
      selectedWorks.forEach(w=>{
        const cur=currentAssignment(w);
        const isDraft=state.drafts.some(d=>d.workId===w.id);
        if(intersectsWeek(w)&&cur!==p.id&&!isDraft){
          items.push({...w,_kind:'proposed'});
        }
      });

      // Current assignee emphasis for selected Assigned Work.
      selectedWorks.forEach(w=>{
        const cur=currentAssignment(w);
        if(cur===p.id&&intersectsWeek(w)){
          const base=existing.find(x=>x.workId===w.id&&x.personId===p.id);
          if(base){
            const idx=items.findIndex(x=>x._kind==='published'&&x.workId===w.id);
            if(idx>=0)items[idx]._currentSelected=true;
          }
        }
      });

      // Draft assignments / reassignments.
      state.drafts.filter(d=>d.toPersonId===p.id).forEach(d=>{
        const w=all.find(x=>x.id===d.workId)||existing.find(x=>x.workId===d.workId);
        if(w&&intersectsWeek(w))items.push({...w,id:d.workId,_kind:'draft'});
      });

      // Source of a reassignment stays visible until Publish.
      state.drafts.filter(d=>d.fromPersonId===p.id&&d.toPersonId!==p.id).forEach(d=>{
        const w=all.find(x=>x.id===d.workId)||existing.find(x=>x.workId===d.workId);
        if(w&&intersectsWeek(w)){
          const base=existing.find(x=>x.workId===w.id&&x.personId===p.id);
          if(base){
            const idx=items.findIndex(x=>x._kind==='published'&&x.workId===w.id);
            if(idx>=0)items[idx]._pendingMove=true;
          }
        }
      });

      const laneEnds=[];
      const placed=items.slice().sort((a,b)=>new Date(a.start)-new Date(b.start)).map(item=>{
        let lane=0;
        while(laneEnds[lane]&&overlap(laneEnds[lane],item))lane++;
        laneEnds[lane]=item;
        return {...item,_lane:lane};
      });
      return {placed,lanes:Math.max(1,laneEnds.length)};
    }

    const workspaceOptions=Object.keys(CP.workspaceSeeds)
      .filter(id=>!state.personAnchor||(d.people[state.personAnchor]&&d.people[state.personAnchor].memberships.includes(id)))
      .map(id=>`<option value="${id}" ${id===workspaceId?'selected':''}>${CP.workspaceSeeds[id].displayName}</option>`).join('');

    const personName=(id)=>((CP.schedulePeopleSeed[workspaceId]||[]).find(p=>p.id===id)||d.people[id]||{name:id}).name;

    return `<div class="calendar-assignment-shell">
      <aside class="calendar-sidebar">
        <div class="calendar-filters">
          <span class="filter-label">Workspace</span>
          <select id="workspaceSelect" class="filter-select workspace-select">${workspaceOptions}</select>

          <span class="filter-label">Work Type</span>
          <select id="workTypeSelect" class="filter-select">${types.map(t=>`<option ${t===state.workTypeFilter?'selected':''}>${t}</option>`).join('')}</select>

          <div class="object-tabs">
            <button class="${state.objectFilter==='All'?'active':''}" data-action="object-filter" data-object="All">All</button>
            <button class="${state.objectFilter==='Work'?'active':''}" data-action="object-filter" data-object="Work">Work</button>
            <button class="${state.objectFilter==='Task'?'active':''}" data-action="object-filter" data-object="Task">Task</button>
          </div><div class="search-wrap"><input id="workSearch" value="${state.searchTerm||''}" placeholder="Search work..."></div>
          <div class="work-count assignment-inline-note"><b>${assignmentDisplayCount(workspaceId)} Work/Task records need to be assigned.</b><span>Only time-phased work appears here. Unphased work appears after a schedule is defined.</span></div>
        </div>

        

        <div class="calendar-work-list">
          ${calendarList.length?calendarList.map(w=>{
            const selected=state.selectedCalendarWorkIds.includes(w.id);
            const draft=state.drafts.find(d=>d.workId===w.id);
            const cur=currentAssignment(w);
            const selIndex=selected?state.selectedCalendarWorkIds.indexOf(w.id)+1:null;
            return `<button class="calendar-work-card ${selected?'selected':''} ${draft?'drafted':''}" data-action="calendar-work-select" data-id="${w.id}" draggable="${draft?'false':'true'}" data-calendar-drag-work="${w.id}" ${draft?'disabled':''}>
              ${selected?`<span class="selection-index">${selIndex}</span>`:''}
              <div>
                <small>${w.type} · ${w.workType||'General'}</small>
                <strong>${w.title}</strong>
                <span>${w.hours}h · ${effectiveStatus(w)}</span>
              </div>
              ${draft?`<em>${draft.fromPersonId?`${personName(draft.fromPersonId)} → `:''}${personName(draft.toPersonId)}</em>`:cur?`<em>${personName(cur)}</em>`:''}
            </button>`;
          }).join(''):'<div class="empty">No work matches the current filters.</div>'}
        </div>
      </aside>

      <section class="weekly-calendar">
        <div class="weekly-calendar-head">
          <div><strong>Weekly Calendar</strong><span>By Assignee</span></div>
          <div class="weekly-calendar-actions">
            <div class="calendar-week-nav">
              <button class="btn icon" data-action="calendar-prev-week" title="Previous week">‹</button>
              <span class="calendar-nav-date">${weekLabel}</span>
              <button class="btn" data-action="calendar-today">Today</button>
              <button class="btn icon" data-action="calendar-next-week" title="Next week">›</button>
            </div>
          </div>
        </div>

        <div class="calendar-week-header">
          <div class="resource-head">
            <details class="calendar-assignee-selector left-selector">
              <summary><span>Assignee</span><small>${activePeopleIds.length} of ${people.length} selected ▾</small></summary>
              <div class="calendar-assignee-menu">
                <div class="calendar-assignee-menu-head"><b>Show assignees</b><div class="calendar-assignee-actions"><button data-action="calendar-assignee-all">All</button><span>·</span><button data-action="calendar-assignee-clear">Clear All</button></div></div>
                ${people.map(p=>`<label class="calendar-assignee-option">
                  <input type="checkbox" data-action="calendar-assignee-menu-select" data-id="${p.id}" ${activePeopleIds.includes(p.id)?'checked':''}>
                  <span><b>${p.name}</b><small>${p.remaining}h remaining</small></span>
                </label>`).join('')}
              </div>
            </details>
          </div>
          ${weekDays.map((dt,i)=>`<div class="${i===todayIndex?'today-col':''}">${dt.toLocaleDateString('en-US',{weekday:'short'})} ${dt.getDate()}</div>`).join('')}
        </div>

        <div class="calendar-resource-list">
          ${activePeopleIds.length?people.filter(p=>activePeopleIds.includes(p.id)).map(p=>{
            const layout=layoutPerson(p);
            const rowHeight=Math.max(58,18+layout.lanes*30);
            const selectedAssignedWorks=selectedWorks.filter(w=>currentAssignment(w)===p.id);
            const isCurrentAssignee=selectedAssignedWorks.length>0;
            return `<div class="calendar-resource-row ${state.personAnchor===p.id?'calendar-resource-anchor':''} ${isCurrentAssignee?'calendar-current-assignee':''}" style="height:${rowHeight}px">
              <div class="calendar-resource-name">
                <div><b>${p.name}</b><span>${p.remaining}h remaining</span></div>
              </div>
              <div class="calendar-resource-grid" data-calendar-drop-person="${p.id}" style="height:${rowHeight}px">
                ${containsToday?`<div class="calendar-today-column" style="left:${todayIndex*14.2857}%"></div>`:''}
                ${layout.placed.map(item=>{
                  const top=8+item._lane*30;
                  if(item._kind==='published'){
                    const est=effectiveStatus(item);
                    const cls=est==='Overdue'?'overdue':est==='In Progress'?'inprogress':est==='Completed'?'completed':est==='At Risk'?'atrisk':'notstarted';
                    const editing=selectedWorks.length>0||state.drafts.length>0;
                    const dim=editing&&!item._related&&!item._currentSelected&&!item._pendingMove?'deemphasized':'';
                    return `<div class="calendar-work-bar ${cls} ${dim} ${item._currentSelected?'current-selected':''} ${item._pendingMove?'reassign-source':''}" draggable="${item._pendingMove?'false':'true'}" data-reassign-work="${item.workId||''}" data-reassign-from="${p.id}" style="left:${dayPct(item.start)}%;width:${dayWidth(item.start,item.end)}%;top:${top}px" title="${item.title} · ${est}${item._pendingMove?' · Draft reassignment pending':''}">${item.title}${item._pendingMove?'<span class="pending-source-label">Pending move</span>':''}</div>`;
                  }
                  if(item._kind==='proposed'){
                    const idx=state.selectedCalendarWorkIds.indexOf(item.id)+1;
                    return `<button class="calendar-proposed-bar" style="left:${dayPct(item.start)}%;width:${dayWidth(item.start,item.end)}%;top:${top}px" data-action="calendar-draft-here" data-person="${p.id}" data-work="${item.id}"><span class="calendar-proposed-index">${idx}</span>Proposed · ${item.title}</button>`;
                  }
                  const est=effectiveStatus(item);
                  const cls=est==='Overdue'?'overdue':est==='In Progress'?'inprogress':est==='At Risk'?'atrisk':'notstarted';
                  return `<div class="calendar-draft-bar ${cls}" style="left:${dayPct(item.start)}%;width:${dayWidth(item.start,item.end)}%;top:${top}px"><span>${item.title}</span><button data-action="cancel-draft" data-id="${item.id||''}">×</button></div>`;
                }).join('')}
              </div>
            </div>`;
          }).join(''):'<div class="calendar-empty-assignees">No assignees selected. Use the Assignee menu to add people.</div>'}
        </div>
      </section>
    </div>`;
  }

  CP.renderSchedule=function(state,d){
    const workspaceId=state.workspaceId||'W1'; const ws=d.workspaces[workspaceId]; const wi=state.selectedWeek==null?0:state.selectedWeek;
    const allowedPerson=state.personAnchor?d.people[state.personAnchor]:null;
    const allowedWorkspaces=allowedPerson?allowedPerson.memberships:[workspaceId];
    const all=allWork(state).filter(w=>w.workspaceId===workspaceId);
    const currentAssignment=(w)=>{const pub=state.publishedAssignments.find(a=>a.workId===w.id);return pub?pub.toPersonId:w.assignedTo;};
    const filtered=all.filter(w=>{
      const assigned=!!currentAssignment(w);
      if(assigned) return false;
      if(state.objectFilter!=='All' && w.type!==state.objectFilter) return false;
      if(state.workTypeFilter!=='All types' && w.workType!==state.workTypeFilter) return false;
      const q=(state.searchTerm||'').trim().toLowerCase();
      return !q || w.title.toLowerCase().includes(q) || (w.workType||'').toLowerCase().includes(q);
    });
    const draftIds=new Set(state.drafts.map(x=>x.workId));
    const list=filtered.concat(all.filter(w=>draftIds.has(w.id) && !filtered.includes(w)));
    const people=(CP.schedulePeopleSeed[workspaceId]||[]).map(p=>({...p}));
    const selectedIds=state.selectedGanttWorkIds||[]; const selectedWorks=allWork(state).filter(w=>selectedIds.includes(w.id)); const selected=selectedWorks[selectedWorks.length-1]||null;
    const baseExisting=(CP.existingScheduleSeed[workspaceId]||[]).map((x,idx)=>({...x,workId:x.workId||`SCH-${workspaceId}-${idx}`}));
    const allScheduleWork=allWork(state).filter(w=>w.workspaceId===workspaceId);
    const workForId=(id)=>allScheduleWork.find(w=>w.id===id)||baseExisting.find(x=>x.workId===id)||null;
    const publishedByWork=new Map(state.publishedAssignments.map(a=>[a.workId,a]));
    const existingBaseIds=new Set(baseExisting.filter(x=>x.workId).map(x=>x.workId));
    const existing=baseExisting.map(x=>{
      if(!x.workId)return {...x};
      const pub=publishedByWork.get(x.workId);
      if(!pub)return {...x};
      return {...x,personId:pub.toPersonId};
    });
    state.publishedAssignments.forEach(pub=>{
      if(existingBaseIds.has(pub.workId))return;
      const w=allScheduleWork.find(x=>x.id===pub.workId);
      if(!w)return;
      existing.push({personId:pub.toPersonId,workId:w.id,title:w.title,start:w.start,end:w.end,status:w.status});
    });
    const types=['All types',...Array.from(new Set(all.map(w=>w.workType).filter(Boolean)))];
    const rangeStart=new Date('2026-08-20T00:00:00'); const rangeEnd=new Date('2026-09-17T00:00:00'); const totalDays=28;
    const pct=(date)=>{const dt=new Date(date+'T00:00:00'); return Math.max(0,Math.min(100,((dt-rangeStart)/(86400000*totalDays))*100));};
    const widthPct=(a,b)=>Math.max(2,pct(b)-pct(a)+100/29);
    const dateLabels=[]; for(let i=0;i<29;i++){const dt=new Date(rangeStart.getTime()+i*86400000); const mon=dt.toLocaleString('en-US',{month:'short'}); const day=dt.getDate(); dateLabels.push(`<span class="${i===14?'today-head':''}">${i===14?'Today · ':''}${mon} ${day}</span>`)}
    const workspaceOptions=Object.keys(CP.workspaceSeeds).filter(id=>allowedWorkspaces.includes(id)||!state.personAnchor).map(id=>`<option value="${id}" ${id===workspaceId?'selected':''}>${CP.workspaceSeeds[id].displayName}</option>`).join('');
    const intervalsOverlap=(a,b)=>!(new Date(a.end+'T00:00:00')<new Date(b.start+'T00:00:00') || new Date(a.start+'T00:00:00')>new Date(b.end+'T00:00:00'));
    const laneLayout=(items)=>{
      const lanes=[];
      return items.slice().sort((a,b)=>new Date(a.start)-new Date(b.start)).map(item=>{
        let lane=0;
        while(lanes[lane] && intervalsOverlap(lanes[lane],item)) lane++;
        lanes[lane]=item;
        return {...item,_lane:lane};
      });
    };
    const publishedForPerson=(p)=>laneLayout(existing.filter(x=>x.personId===p.id));
    const renderBars=(p)=>publishedForPerson(p).map(x=>{
      const est=effectiveStatus(x); const cls=est==='Overdue'?'overdue':est==='In Progress'?'inprogress':est==='Completed'?'completed':est==='At Risk'?'atrisk':'notstarted';
      const currentSelected=selectedIds.includes(x.workId);
      const sourceDraft=state.drafts.find(draft=>draft.workId===x.workId && draft.fromPersonId===p.id && draft.toPersonId!==p.id);
      const dim=(selected||state.drafts.length)&&!currentSelected&&!sourceDraft?'deemphasized':'';
      const top=9+(x._lane*31);
      return `<div class="published-bar ${cls} ${dim} ${currentSelected?'current-selected':''} ${sourceDraft?'reassign-source':''}" draggable="${sourceDraft?'false':'true'}" data-reassign-work="${x.workId||''}" data-reassign-from="${p.id}" style="left:${pct(x.start)}%;width:${widthPct(x.start,x.end)}%;top:${top}px" title="${x.title} · ${est}${sourceDraft?' · Draft reassignment pending':''}">${x.title}${sourceDraft?'<span class="pending-source-label">Pending move</span>':''}</div>`;
    }).join('');
    const rowLaneCount=(p)=>{
      const published=publishedForPerson(p);
      let maxLane=published.reduce((m,x)=>Math.max(m,x._lane),0);
      const extraBars=[];
      selectedWorks.filter(w=>!draftIds.has(w.id)&&currentAssignment(w)!==p.id).forEach(w=>extraBars.push(w));
      state.drafts.filter(x=>x.toPersonId===p.id).forEach(draft=>{const w=allWork(state).find(x=>x.id===draft.workId); if(w) extraBars.push(w);});
      extraBars.forEach(w=>{
        let lane=0;
        while(published.some(x=>x._lane===lane && intervalsOverlap(x,w))) lane++;
        maxLane=Math.max(maxLane,lane);
      });
      return maxLane+1;
    };
    const nextOpenLane=(p,w)=>{
      const published=publishedForPerson(p);
      let lane=0;
      while(published.some(x=>x._lane===lane && intervalsOverlap(x,w))) lane++;
      return lane;
    };
    const personName=(id)=>((CP.schedulePeopleSeed[workspaceId]||[]).find(p=>p.id===id)||d.people[id]||{name:id}).name;
    const hasConflict=(personId,w)=>existing.some(x=>x.personId===personId && !(new Date(x.end+'T00:00:00')<new Date(w.start+'T00:00:00') || new Date(x.start+'T00:00:00')>new Date(w.end+'T00:00:00')));
    return `<div class="schedule-shell ${state.drafts.length?'draft-session':''} ${(selected||state.drafts.length)?'editing-session':''} ${state.personAnchor?'anchor-session':''}"><header class="schedule-header"><div><button class="link-btn" data-action="workspace" data-id="${workspaceId}">← Capacity Planning</button><h1>Schedule</h1></div><div class="schedule-actions">${state.drafts.length?`<span class="draft-count">${state.drafts.length} Draft Change${state.drafts.length>1?'s':''}</span><button class="btn" data-action="cancel-all">Cancel Drafts</button><button class="btn primary" data-action="publish">Publish ${state.drafts.length}</button>`:''}</div></header>
      <div class="schedule-toolbar"><div class="segmented"><button class="active">Assignment</button><button>My Availability</button></div><div class="assignment-view-tabs"><button class="${state.assignmentView==='timeline'?'active':''}" data-action="assignment-view" data-view="timeline">Gantt</button><button class="${state.assignmentView==='calendar'?'active':''}" data-action="assignment-view" data-view="calendar">Calendar</button></div>${state.personAnchor?`<div class="anchor-chip"><b>${allowedPerson.name}</b> highlighted · You can still assign work to any assignee shown</div>`:''}<div class="timeline-legend"><span><i class="legend-dot red"></i>Overdue</span><span><i class="legend-dot blue"></i>In Progress</span><span><i class="legend-dot yellow"></i>At Risk</span><span><i class="legend-dot gray"></i>New / Not Started</span></div></div>
      <div class="schedule-main ${state.assignmentView==='timeline'?'':'view-hidden'}"><aside class="work-list"><div class="schedule-filters"><span class="filter-label">Workspace</span><select id="workspaceSelect" class="filter-select workspace-select">${workspaceOptions}</select><span class="filter-label">Work Type</span><select id="workTypeSelect" class="filter-select">${types.map(t=>`<option ${t===state.workTypeFilter?'selected':''}>${t}</option>`).join('')}</select><div class="object-tabs"><button class="${state.objectFilter==='All'?'active':''}" data-action="object-filter" data-object="All">All</button><button class="${state.objectFilter==='Work'?'active':''}" data-action="object-filter" data-object="Work">Work</button><button class="${state.objectFilter==='Task'?'active':''}" data-action="object-filter" data-object="Task">Task</button></div><div class="search-wrap"><input id="workSearch" value="${state.searchTerm||''}" placeholder="Search work..."></div><div class="work-count assignment-inline-note"><b>${assignmentDisplayCount(workspaceId)} Work/Task records need to be assigned.</b><span>Only time-phased work appears here. Unphased work appears after a schedule is defined.</span></div></div>
        <div class="work-items">${list.length?list.map(w=>{const dr=state.drafts.find(x=>x.workId===w.id);const cur=currentAssignment(w);const disabled=!!dr;return `<button class="work-item ${selectedIds.includes(w.id)?'selected':''} ${disabled?'drafted':''}" data-action="select-work" data-id="${w.id}" ${disabled?'disabled':''} draggable="${!disabled}">${selectedIds.includes(w.id)?`<span class="selection-index">${selectedIds.indexOf(w.id)+1}</span>`:'' }<div><small>${w.type} · ${w.workType||'General'}</small><strong>${w.title}</strong><span>${w.hours}h · ${w.status}</span></div>${dr?`<em>Draft → ${((CP.schedulePeopleSeed[workspaceId]||[]).find(p=>p.id===dr.toPersonId)||d.people[dr.toPersonId]||{name:dr.toPersonId}).name}</em>`:cur?`<em>${((CP.schedulePeopleSeed[workspaceId]||[]).find(p=>p.id===cur)||d.people[cur]||{name:cur}).name}</em>`:''}</button>`}).join(''):'<div class="empty">No work matches the current filters.</div>'}</div></aside>
        <section class="gantt"><div class="gantt-head"><div class="assignee-col"><strong>Assignee</strong><span>${CP.workspaceSeeds[workspaceId].displayName}</span></div><div class="timeline-head">${dateLabels.join('')}<div class="today-marker head"><b>Today</b></div></div></div>
          ${people.map(p=>{const isAnchor=state.personAnchor===p.id;const drafts=state.drafts.filter(x=>x.toPersonId===p.id);const isCurrentAssignee=selectedWorks.some(w=>currentAssignment(w)===p.id);const proposedWorks=selectedWorks.filter(w=>!draftIds.has(w.id)&&currentAssignment(w)!==p.id);const lanes=rowLaneCount(p);const rowHeight=Math.max(70,18+(lanes+Math.max(0,proposedWorks.length-1))*31);return `<div class="gantt-row ${isAnchor?'anchor':''} ${isCurrentAssignee?'current-assignee-row':''}" data-person="${p.id}" style="height:${rowHeight}px"><div class="assignee-col"><strong>${p.name}</strong></div><div class="timeline-row" data-drop-person="${p.id}" style="height:${rowHeight}px"><div class="today-marker"></div>${renderBars(p)}${proposedWorks.map((w,idx)=>`<button class="proposed-bar" style="left:${pct(w.start)}%;width:${widthPct(w.start,w.end)}%;top:${9+(nextOpenLane(p,w)+idx)*31}px" data-action="draft-here" data-person="${p.id}" data-work="${w.id}"><span class="calendar-proposed-index">${selectedIds.indexOf(w.id)+1}</span>Proposed · ${w.title}</button>`).join('')}${drafts.map(draft=>{const w=workForId(draft.workId);const conflict=w?hasConflict(p.id,w):false;const lane=nextOpenLane(p,w);return w?`<div class="draft-bar ${draftFill(w)} ${conflict?'conflict':''}" style="left:${pct(w.start)}%;width:${widthPct(w.start,w.end)}%;top:${9+lane*31}px" title="${w.title} · Draft${conflict?' · Conflict':''}"><span>${w.title}</span>${conflict?'<span class="conflict-label">Conflict</span>':''}<button data-action="cancel-draft" data-id="${draft.workId}" title="Cancel draft">×</button></div>`:''}).join('')}</div></div>`}).join('')}
        </section></div>
      ${state.assignmentView==='calendar'?renderCalendarAssignment(state,d,workspaceId,all,currentAssignment,people,existing,types):''}
      ${selectedWorks.length?`<div class="selection-footer"><div><strong>${selectedWorks.length} Work/Task${selectedWorks.length>1?'s':''} selected</strong><span>${selectedWorks.map((w,i)=>`${i+1}. ${w.title}`).join(' · ')}</span></div><span>Click a selected item again to deselect it. Drag a Work/Task to an assignee, or click its numbered Proposed Placement.</span></div>`:''}
    </div>`;
  };
})();

                <div class="mode-options">

                    <div>

                      <span>Use one Planned Working Hours value for the entire Work / Task.</span>
                    </div>
                  </label>
                  <label class="mode-option ${cfg.pwhMode==='status'?'selected':''}">
                    <input type="radio" name="pwhMode" value="status" ${cfg.pwhMode==='status'?'checked':''}>
                    <div>
                      <strong>By Status</strong>
                      <span>Set Planned Working Hours separately for each Status.</span>
                    </div>
                  </label>
                </div>

                ${cfg.pwhMode==='whole'?`
                  <div class="whole-hours-row">
                    <label>Planned Working Hours</label>
                    <div class="hours-input-wrap">
                      <input id="wholeHoursInput" type="number" min="0" step="0.5" value="${cfg.wholeHours}">
                      <span>hours</span>
                    </div>
                  </div>
                `:`
                  <div class="status-config-table">
                    <div class="status-config-head">
                      <span>Status</span>
                      <span>Planned Working Hours</span>
                      <span>Required Role</span>
                      <span>Role Selection</span>
                    </div>
                    ${statuses.map(st=>{
                      const sr=cfg.statusRoles[st];
                      return `<div class="status-config-row">
                        <span class="status-name">${st}</span>
                        <div class="hours-input-wrap compact">
                          <input type="number" min="0" step="0.5" value="${sr.hours}" data-status-hours="${st}">
                          <span>h</span>
                        </div>
                        <select class="role-mode-select" data-action="status-role-mode" data-status="${st}">
                          <option value="any" ${sr.mode==='any'?'selected':''}>Any permitted role in Workspace</option>
                          <option value="specific" ${sr.mode==='specific'?'selected':''}>Specific required role</option>
                        </select>
                        <div class="role-multi ${sr.mode==='specific'?'':'disabled'}">
                          <details>
                            <summary>${sr.roles.length?sr.roles.join(', '):'Select roles...'}</summary>
                            <div class="role-menu">
                              ${roleOptions.map(role=>`<label><input type="checkbox" data-action="status-role-option" data-status="${st}" data-role="${role}" ${sr.roles.includes(role)?'checked':''}>${role}</label>`).join('')}
                            </div>
                          </details>
                        </div>
                      </div>`;
                    }).join('')}
                  </div>
                `}
              </div>

              <div class="setting-block">
                <div class="setting-heading">
                  <div>
                    <h3>Schedule Requirement</h3>
                    <p>Define how this Job Type becomes time-phased for Capacity Planning and which field supplies the planning date.</p>
                  </div>
                </div>

                <div class="mode-options">
                  <label class="mode-option ${cfg.scheduleRequirement==='specific'?'selected':''}">
                    <input type="radio" name="scheduleRequirement" value="specific" ${cfg.scheduleRequirement==='specific'?'checked':''}>
                    <div>
                      <strong>Specific Schedule Required</strong>
                      <span>Work requires a specific scheduled Date & Time window.</span>
                    </div>
                  </label>
                  <label class="mode-option ${cfg.scheduleRequirement==='due'?'selected':''}">
                    <input type="radio" name="scheduleRequirement" value="due" ${cfg.scheduleRequirement==='due'?'checked':''}>
                    <div>
                      <strong>Due-date-driven</strong>
                      <span>Work can be completed at any time before its due date.</span>
                    </div>
                  </label>
                </div>

                ${cfg.scheduleRequirement==='specific'?`
                  <div class="schedule-field-row">
                    <div>
                      <label>Schedule Date / Date & Time Field</label>
                      <p>Select the field in this Job Type that provides the specific schedule date or Date & Time window.</p>
                    </div>
                    <select id="scheduleFieldSelect" class="field-source-select">
                      ${['Scheduled Date & Time','Planned Start','Field Visit Window','Appointment Date','Target Service Date'].map(f=>`<option ${cfg.scheduleField===f?'selected':''}>${f}</option>`).join('')}
                    </select>
                  </div>
                `:`
                  <div class="schedule-field-row">
                    <div>
                      <label>Due Date Field</label>
                      <p>Select the field in this Job Type that provides the due date used for due-date-driven planning.</p>
                    </div>
                    <select id="dueDateFieldSelect" class="field-source-select">
                      ${['Due Date','Required By Date','Commitment Date','Target Completion Date','Service Deadline'].map(f=>`<option ${cfg.dueDateField===f?'selected':''}>${f}</option>`).join('')}
                    </select>
                  </div>
                `}
              </div>

              <div class="config-save-row">
                <button class="btn primary large">Save Changes</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>`;
  };
})();;

(function(){
  const CP=window.CP; const app=document.getElementById('app'); const state=CP.createState(); window.prototypeState=state;
  let toastTimer=null,lastToastText=null;
  function calendarOffsetForDate(dateStr){
    const base=new Date('2026-08-31T00:00:00');
    const dt=new Date(dateStr+'T00:00:00');
    return Math.floor((dt-base)/(86400000*7));
  }
  function render(){
    const d=CP.derive(state); let html='';
    if(state.view==='portfolio') html=CP.renderPortfolio(state,d);
    else if(state.view==='workspace') html=CP.renderWorkspace(state,d);
    else if(state.view==='unphased') html=CP.renderUnphased(state,d);
    else if(state.view==='schedule') html=CP.renderSchedule(state,d);
    else if(state.view==='configuration') html=CP.renderConfiguration(state);
    app.innerHTML=`<nav class="side-nav"><div class="brand">C</div><button class="nav-item">⌂<span>Home</span></button><button class="nav-item ${state.view!=='configuration'?'active':''}" data-action="nav-capacity">▥<span>Capacity</span></button><button class="nav-item">▤<span>Schedule</span></button><button class="nav-item ${state.view==='configuration'?'active':''}" data-action="nav-configuration">⚙<span>Configuration</span></button></nav><main>${html}</main>${state.toast?`<div class="toast">✓ ${state.toast}<button data-action="clear-toast">×</button></div>`:''}`;
    wireDrag();
    if(state.toast!==lastToastText){
      lastToastText=state.toast;
      if(toastTimer)clearTimeout(toastTimer);
      if(state.toast){
        toastTimer=setTimeout(()=>{state.toast=null;lastToastText=null;toastTimer=null;render();},5000);
      }
    }
  }
  function navigateWorkspace(id){state.workspaceId=id; state.selectedWeek=null; state.view='workspace'; state.sidePanel=null; render();}
  app.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]'); if(!el)return; const a=el.dataset.action;
    if(a==='nav-capacity'){state.view='portfolio';state.workspaceId=null;state.selectedWeek=null;}
    if(a==='nav-configuration'){state.view='configuration';}
    if(a==='config-capacity-toggle'){state.config.capacityPlanningEnabled=el.checked;}
    if(a==='status-role-mode'){state.config.statusRoles[el.dataset.status].mode=el.value;}
    if(a==='status-role-option'){
      const st=el.dataset.status,role=el.dataset.role,arr=state.config.statusRoles[st].roles;
      state.config.statusRoles[st].roles=arr.includes(role)?arr.filter(x=>x!==role):[...arr,role];
    }
    if(a==='portfolio'){state.view='portfolio';state.workspaceId=null;state.selectedWeek=null;}
    if(a==='portfolio-week'){state.portfolioWeek=+el.dataset.week;}
    if(a==='summary-assignment'){state.selectedWeek=+el.dataset.week;state.workspaceId='W1';state.view='schedule';state.assignmentView='timeline';state.selectedGanttWorkIds=[];state.selectedCalendarWorkIds=[];state.personAnchor=null;}
    if(a==='workspace') navigateWorkspace(el.dataset.id);
    if(a==='select-week'){state.selectedWeek=+el.dataset.week;}
    if(a==='open-week'){state.workspaceId='W1';state.selectedWeek=+el.dataset.week;state.view='workspace';}
    if(a==='review-unassigned'||a==='open-assignment'){state.workspaceId=state.workspaceId||'W1';state.selectedWeek=state.selectedWeek==null?0:state.selectedWeek;state.view='schedule';state.scheduleMode='work';state.scheduleTab='Unassigned';state.personAnchor=null;state.calendarWeekOffset=0;}
    if(a==='assignment-view'){state.assignmentView=el.dataset.view;}
    if(a==='calendar-work-select'){
      const id=el.dataset.id;
      const already=state.selectedCalendarWorkIds.includes(id);
      state.selectedCalendarWorkIds=already?state.selectedCalendarWorkIds.filter(x=>x!==id):[...state.selectedCalendarWorkIds,id];
      if(!already){
        const w=[...state.work,...state.phasedFromUnphased].find(x=>x.id===id);
        if(w)state.calendarWeekOffset=calendarOffsetForDate(w.start);
      }
    }
    if(a==='calendar-assignee-menu-select'){
      const allIds=(CP.schedulePeopleSeed[state.workspaceId]||[]).map(p=>p.id);
      const cur=state.selectedCalendarAssigneeIds.includes('__none__')?[]:(state.selectedCalendarAssigneeIds.length?[...state.selectedCalendarAssigneeIds]:[...allIds]);
      const id=el.dataset.id;
      state.selectedCalendarAssigneeIds=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];
      if(state.selectedCalendarAssigneeIds.length===0)state.selectedCalendarAssigneeIds=['__none__'];
    }
    if(a==='calendar-assignee-all'){state.selectedCalendarAssigneeIds=[];}
    if(a==='calendar-assignee-clear'){state.selectedCalendarAssigneeIds=['__none__'];}
    if(a==='calendar-prev-week'){state.calendarWeekOffset=(state.calendarWeekOffset||0)-1;}
    if(a==='calendar-next-week'){state.calendarWeekOffset=(state.calendarWeekOffset||0)+1;}
    if(a==='calendar-today'){state.calendarWeekOffset=0;}
    if(a==='calendar-draft-here'){
      const workId=el.dataset.work;
      const w=[...state.work,...state.phasedFromUnphased].find(x=>x.id===workId);
      state.selectedWorkId=workId;
      createDraft(el.dataset.person);
      state.selectedCalendarWorkIds=state.selectedCalendarWorkIds.filter(id=>id!==workId);
      if(w)state.calendarWeekOffset=calendarOffsetForDate(w.start);
    }
    if(a==='review-unphased'){state.view='unphased';}
    if(a==='set-schedule'){state.sidePanel=el.dataset.id;}
    if(a==='close-panel'){state.sidePanel=null;}
    if(a==='save-schedule'){const wi=+document.getElementById('scheduleWeek').value; CP.phaseItem(state,el.dataset.id,{weekIndex:wi,start:document.getElementById('scheduleStart').value,end:document.getElementById('scheduleEnd').value});state.sidePanel=null;}
    if(a==='find-work'){state.personAnchor=el.dataset.person;state.scheduleMode='person';state.scheduleTab='Unassigned';state.selectedWeek=state.selectedWeek==null?0:state.selectedWeek;state.view='schedule';}
    if(a==='object-filter'){state.objectFilter=el.dataset.object;state.selectedWorkId=null;}

    if(a==='select-work'){
      const id=el.dataset.id,cur=state.selectedGanttWorkIds||[];
      state.selectedGanttWorkIds=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];
      state.selectedWorkId=state.selectedGanttWorkIds[state.selectedGanttWorkIds.length-1]||null;
    }
    if(a==='draft-here'){
      if(el.dataset.work)state.selectedWorkId=el.dataset.work;
      createDraft(el.dataset.person);
    }
    if(a==='cancel-draft'){state.drafts=state.drafts.filter(x=>x.workId!==el.dataset.id);state.selectedWorkId=null;state.toast=state.drafts.length?'Draft change removed':'Draft changes cleared';}
    if(a==='cancel-all'){state.drafts=[];state.selectedWorkId=null;}
    if(a==='publish'){CP.publish(state);}
    if(a==='clear-toast'){state.toast=null;lastToastText=null;if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}}
    render();
  });
  app.addEventListener('change',e=>{
    if(e.target.name==='pwhMode'){state.config.pwhMode=e.target.value;render();}
    if(e.target.name==='scheduleRequirement'){state.config.scheduleRequirement=e.target.value;render();}
    if(e.target.id==='scheduleFieldSelect'){state.config.scheduleField=e.target.value;}
    if(e.target.id==='dueDateFieldSelect'){state.config.dueDateField=e.target.value;}
    if(e.target.id==='wholeHoursInput'){state.config.wholeHours=Number(e.target.value)||0;}
    if(e.target.matches('[data-status-hours]')){state.config.statusRoles[e.target.dataset.status].hours=Number(e.target.value)||0;}
    if(e.target.matches('[data-action="status-role-mode"]')){state.config.statusRoles[e.target.dataset.status].mode=e.target.value;render();}
    if(e.target.id==='workspaceSelect'||e.target.name==='scheduleWorkspace'){state.workspaceId=e.target.value;state.selectedWorkId=null;state.selectedGanttWorkIds=[];state.selectedCalendarWorkIds=[];state.selectedCalendarAssigneeIds=[];state.calendarWeekOffset=0;state.workTypeFilter='All types';render();}
    if(e.target.id==='workTypeSelect'){state.workTypeFilter=e.target.value;state.selectedWorkId=null;render();}
  });
  app.addEventListener('input',e=>{
    if(e.target.id==='workSearch'){state.searchTerm=e.target.value;render(); const inp=document.getElementById('workSearch'); if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  });
  function createDraft(personId,fromOverride=null){
    if(!state.selectedWorkId)return;
    const workId=state.selectedWorkId;
    const existing=state.drafts.findIndex(x=>x.workId===workId);
    const w=[...state.work,...state.phasedFromUnphased].find(x=>x.id===workId);
    const pub=state.publishedAssignments.find(x=>x.workId===workId);
    const fromPersonId=fromOverride||(pub?pub.toPersonId:(w&&w.assignedTo?w.assignedTo:null));
    if(fromPersonId&&fromPersonId===personId){state.selectedWorkId=null;return;}
    const item={workId,toPersonId:personId,fromPersonId}; if(existing>=0)state.drafts[existing]=item; else state.drafts.push(item); state.selectedGanttWorkIds=(state.selectedGanttWorkIds||[]).filter(id=>id!==workId);state.selectedCalendarWorkIds=(state.selectedCalendarWorkIds||[]).filter(id=>id!==workId);state.selectedWorkId=null; state.toast=`Draft created · ${state.drafts.length} unpublished change${state.drafts.length>1?'s':''}`;
  }
  function wireDrag(){
    // Gantt drag/drop.
    document.querySelectorAll('.work-item[draggable="true"]').forEach(el=>el.addEventListener('dragstart',ev=>{
      state.selectedWorkId=el.dataset.id;
      ev.dataTransfer.effectAllowed='move';
      ev.dataTransfer.setData('text/plain',el.dataset.id);
      setTimeout(render,0);
    }));
    document.querySelectorAll('[data-drop-person]').forEach(el=>{
      el.addEventListener('dragover',ev=>ev.preventDefault());
      el.addEventListener('drop',ev=>{
        ev.preventDefault();
        state.selectedWorkId=ev.dataTransfer.getData('text/plain');
        const from=ev.dataTransfer.getData('application/x-reassign-from')||null;
        createDraft(el.dataset.dropPerson,from);
        render();
      });
    });

    // Direct reassignment: drag any existing published Work/Task bar to another assignee.
    document.querySelectorAll('[data-reassign-work][draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart',ev=>{
        const workId=el.dataset.reassignWork;if(!workId)return;
        ev.dataTransfer.effectAllowed='move';
        ev.dataTransfer.setData('text/plain',workId);
        ev.dataTransfer.setData('application/x-reassign-from',el.dataset.reassignFrom||'');
        el.classList.add('dragging-reassign');
      });
      el.addEventListener('dragend',()=>el.classList.remove('dragging-reassign'));
    });

    // Calendar drag/drop. Drag one specific Work/Task card to any visible Assignee row.
    document.querySelectorAll('[data-calendar-drag-work][draggable="true"]').forEach(el=>{
      el.addEventListener('dragstart',ev=>{
        const workId=el.dataset.calendarDragWork;
        ev.dataTransfer.effectAllowed='move';
        ev.dataTransfer.setData('text/plain',workId);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    });
    document.querySelectorAll('[data-calendar-drop-person]').forEach(el=>{
      el.addEventListener('dragenter',ev=>{
        ev.preventDefault();
        el.classList.add('calendar-drop-target');
      });
      el.addEventListener('dragover',ev=>{
        ev.preventDefault();
        ev.dataTransfer.dropEffect='move';
        el.classList.add('calendar-drop-target');
      });
      el.addEventListener('dragleave',ev=>{
        if(!el.contains(ev.relatedTarget))el.classList.remove('calendar-drop-target');
      });
      el.addEventListener('drop',ev=>{
        ev.preventDefault();
        el.classList.remove('calendar-drop-target');
        const workId=ev.dataTransfer.getData('text/plain');
        if(!workId)return;
        const work=[...state.work,...state.phasedFromUnphased].find(x=>x.id===workId);
        const from=ev.dataTransfer.getData('application/x-reassign-from')||null;
        state.selectedWorkId=workId;
        createDraft(el.dataset.calendarDropPerson,from);
        state.selectedCalendarWorkIds=state.selectedCalendarWorkIds.filter(id=>id!==workId);
        if(work)state.calendarWeekOffset=calendarOffsetForDate(work.start);
        render();
      });
    });
  }
  render();
})();
</script></body></html>
